name: Build SolYan IPTV MiTV3 APK

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/platforms" | tail -20 || true
          ls -la "$ANDROID_HOME/build-tools" | tail -20 || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SolYan-IPTV-MiTV3-v0.2.9.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SolYan-IPTV-MiTV3-v0.2.9-APK
          path: SolYan-IPTV-MiTV3-v0.2.9.apk
          if-no-files-found: error
